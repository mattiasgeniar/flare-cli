      description: Detail for artisan command aggregations.
      properties:
        command:
          type:
            - string
          description: The command signature.
          examples:
            - 'inspire'
    externalHttpDetail:
      type:
        - object
      description: Detail for external HTTP request aggregations.
      properties:
        method:
          type:
            - string
          description: The HTTP request method.
          examples:
            - POST
        serverAddress:
          type:
            - string
          description: The external server address.
          examples:
            - api.stripe.com
        urlPath:
          type:
            - string
          description: The URL path.
          examples:
            - /v1/charges
        http_code_1xx:
          type:
            - 'null'
            - integer
          description: Count of 1xx HTTP status codes.
        http_code_2xx:
          type:
            - 'null'
            - integer
          description: Count of 2xx HTTP status codes.
        http_code_3xx:
          type:
            - 'null'
            - integer
          description: Count of 3xx HTTP status codes.
        http_code_4xx:
          type:
            - 'null'
            - integer
          description: Count of 4xx HTTP status codes.
        http_code_5xx:
          type:
            - 'null'
            - integer
          description: Count of 5xx HTTP status codes.
        http_codes:
          type:
            - object
          description: Map of specific HTTP status codes to their counts.
          additionalProperties:
            type:
              - integer
    viewDetail:
      type:
        - object
      description: Detail for view aggregations.
      properties:
        name:
          type:
            - string
          description: The view name.
          examples:
            - users.index
        type:
          type:
            - string
          enum:
            - view
            - component
            - inline_component
          description: The view type.
          examples:
            - view
    livewireComponentDetail:
      type:
        - object
      description: Detail for Livewire component aggregations.
      properties:
        name:
          type:
            - string
          description: The Livewire component name.
          examples:
            - user-table
        class:
          type:
            - string
          description: The Livewire component class.
          examples:
            - App\Livewire\UserTable
paths:
  /me:
    get:
      operationId: get-authenticated-user
      tags:
        - user
      summary: Get the authenticated user.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'
  /projects:
    get:
      operationId: list-projects
      tags:
        - projects
      summary: Get all projects.
      parameters:
        - in: query
          name: filter[id]
          required: false
          schema:
            type:
              - integer
          description: The project identifier.
        - in: query
          name: filter[name]
          required: false
          schema:
            type:
              - string
          description: The project name.
        - in: query
          name: filter[team_id]
          required: false
          schema:
            type:
              - integer
          description: The team identifier.
        - in: query
          name: include
          required: false
          schema:
            type:
              - string
            enum:
              - team
          description: Include information about the team.
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginatedResult'
                  - type:
                      - object
                    properties:
                      data:
                        type:
                          - array
                        items:
                          $ref: '#/components/schemas/project'
    post:
      operationId: create-project
      tags:
        - projects
      summary: Create a new project.
      requestBody:
        content:
          application/json:
            schema:
              required:
                - name
                - team_id
                - stage
                - technology
              properties:
                name:
                  type:
                    - string
                  description: The project's name.
                  examples:
                    - Flare
                team_id:
                  type:
                    - integer
                  description: The team's identifier.
                  examples:
                    - 1
                stage:
                  type:
                    - string
                  enum:
                    - local
                    - development
                    - staging
                    - production
                  description: The project's stage.
                  examples:
                    - production
                technology:
                  type:
                    - string
                  enum:
                    - Laravel
                    - PHP
                    - JS
                    - Vue
                    - React
                  description: The project's technology.
                  examples:
                    - PHP
                group:
                  type:
                    - 'null'
                    - string
                  examples:
                    - Flare dev
                  description: The project's group.
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/project'
  /projects/{project_id}:
    delete:
      operationId: delete-project
      tags:
        - projects
      summary: Delete a project.
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type:
              - integer
          description: The project identifier.
      responses:
        '204':
          description: Successful response
  /projects/{project_id}/errors:
    get:
      operationId: list-project-errors
      tags:
        - errors
      summary: Get all errors within a project.
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type:
              - integer
          description: The project identifier.
        - in: query
          name: filter[id]
          required: false
          schema:
            type:
              - integer
          description: The project identifier.
        - in: query
          name: filter[exception_message]
          required: false
          schema:
            type:
              - string
          description: The exception message of the error.
        - in: query
          name: filter[exception_class]
          required: false
          schema:
            type:
              - string
          description: The exception class of the error.
        - in: query
          name: filter[file]
          required: false
          schema:
            type:
              - string
          description: The file where the error occurred.
        - in: query
          name: filter[status]
          required: false
          schema:
            type:
              - string
            enum:
              - open
              - resolved
          description: The status of the error.
        - in: query
          name: filter[stage]
          required: false
          schema:
            type:
              - string
          description: The stage of the error.
        - in: query
          name: filter[level]
          required: false
          schema:
            type:
              - string
            enum:
              - debug
              - info
              - notice
              - warning
              - error
              - critical
              - alert
              - emergency
          description: The message log level of the error.
        - in: query
          name: filter[seen_between]
          required: false
          schema:
            type:
              - string
            examples:
              - 2020-07-16T16:41:59Z,2020-08-16T16:41:59Z
          description: The date and time when the error was seen between.
        - in: query
          name: include
          required: false
          schema:
            type:
              - string
            enum:
              - assignees
          description: Include related resources. Use 'assignees' to include assigned users.
        - in: query
          name: sort
          required: false
          schema:
            type:
              - string
            enum:
              - first_seen_at
              - last_seen_at
              - '-first_seen_at'
              - '-last_seen_at'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginatedResult'
                  - type:
                      - object
                    properties:
                      data:
                        type:
                          - array
                        items:
                          $ref: '#/components/schemas/error'
  /projects/{project_id}/error-count:
    get:
      operationId: get-project-error-count
      tags:
        - errors
      summary: Get the number of errors in the given period.
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type:
              - integer
          description: The project identifier.
        - in: query
          name: start_date
          required: true
          description: The start date of the period. Accepts ISO 8601 (e.g. 2021-01-01T00:00:00Z) or Y-m-d H:i:s format.
          schema:
            type:
              - string
            format: date-time
            examples:
              - '2021-01-01T00:00:00.000Z'
        - in: query
          name: end_date
          required: true
          description: The end date of the period. Accepts ISO 8601 (e.g. 2021-01-31T23:59:59Z) or Y-m-d H:i:s format.
          schema:
            type:
              - string
            format: date-time
            examples:
              - '2021-01-31T23:59:59.000Z'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type:
                  - object
                properties:
                  count:
                    type:
                      - integer
                    description: The number of errors that occurred.
  /projects/{project_id}/error-occurrence-count:
    get:
      operationId: get-project-error-occurrence-count
      tags:
        - errors
      summary: Get the number of error occurrences in the given period.
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type:
              - integer
          description: The project identifier.
        - in: query
          name: start_date
          required: true
          description: The start date of the period. Accepts ISO 8601 (e.g. 2021-01-01T00:00:00Z) or Y-m-d H:i:s format.
          schema:
            type:
              - string
            format: date-time
            examples:
              - '2021-01-01T00:00:00.000Z'
        - in: query
          name: end_date
          required: true
          description: The end date of the period. Accepts ISO 8601 (e.g. 2021-01-31T23:59:59Z) or Y-m-d H:i:s format.
          schema:
            type:
              - string
            format: date-time
            examples:
              - '2021-01-31T23:59:59.000Z'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type:
                  - object
                properties:
                  count:
                    type:
                      - integer
                    description: The number of error occurrences that occurred.
  /teams/{team_id}:
    get:
      operationId: get-team
      tags:
        - teams
      summary: Get a team.
      parameters:
        - in: path
          name: team_id
          required: true
          schema:
            type:
              - integer
          description: The team identifier.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/team'
  /teams/{team_id}/users/{user_id}:
    delete:
      operationId: remove-team-user
