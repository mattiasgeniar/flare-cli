        - teams
      summary: Remove a user from a team.
      parameters:
        - in: path
          name: team_id
          required: true
          schema:
            type:
              - integer
          description: The team identifier.
        - in: path
          name: user_id
          required: true
          schema:
            type:
              - integer
          description: The user identifier.
      responses:
        '200':
          description: Successful response
  /errors/{error_id}/occurrences:
    get:
      operationId: list-error-occurrences
      tags:
        - error occurrences
      summary: Get all occurrences for an error.
      parameters:
        - in: path
          name: error_id
          required: true
          schema:
            type:
              - integer
          description: The error identifier.
        - in: query
          name: sort
          required: false
          schema:
            type:
              - string
            enum:
              - received_at
              - '-received_at'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/paginatedResult'
                  - type:
                      - object
                    properties:
                      data:
                        type:
                          - array
                        items:
                          $ref: '#/components/schemas/errorOccurrence'
  /errors/{error_id}/resolve:
    post:
      operationId: resolve-error
      tags:
        - errors
      summary: Resolve an error.
      parameters:
        - in: path
          name: error_id
          required: true
          schema:
            type:
              - integer
          description: The error identifier.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /errors/{error_id}/open:
    post:
      operationId: unresolve-error
      tags:
        - errors
      summary: Reopen an error.
      parameters:
        - in: path
          name: error_id
          required: true
          schema:
            type:
              - integer
          description: The error identifier.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /errors/{error_id}/snooze:
    post:
      operationId: snooze-error
      tags:
        - errors
      summary: Snooze an error.
      parameters:
        - in: path
          name: error_id
          required: true
          schema:
            type:
              - integer
          description: The error identifier.
      requestBody:
        content:
          application/json:
            schema:
              required:
                - snooze_type
              properties:
                snooze_type:
                  type:
                    - string
                  enum:
                    - snooze_until
                    - snooze_forever
                    - snooze_number_of_occurrences
                    - snooze_application_version
                  description: The type of snooze to apply.
                  examples:
                    - snooze_forever
                snooze_until:
                  type:
                    - string
                  format: date-time
                  description: >-
                    The date and time until which the error should be snoozed.
                    Required when snooze_type is snooze_until. Must be in the
                    future.
                  examples:
                    - '2025-12-31T23:59:59.000Z'
                snooze_number_of_occurrences:
                  type:
                    - integer
                  minimum: 1
                  description: >-
                    The number of occurrences to snooze for. Required when
                    snooze_type is snooze_number_of_occurrences.
                  examples:
                    - 10
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /errors/{error_id}/unsnooze:
    post:
      operationId: unsnooze-error
      tags:
        - errors
      summary: Unsnooze an error.
      parameters:
        - in: path
          name: error_id
          required: true
          schema:
            type:
              - integer
          description: The error identifier.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
  /error-occurrences/{occurrence_id}:
    get:
      operationId: get-error-occurrence
      tags:
        - error occurrences
      summary: Get an error occurrence.
      parameters:
        - in: path
          name: occurrence_id
          required: true
          schema:
            type:
              - integer
          description: The error occurrence identifier.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorOccurrence'
  /projects/{project_id}/monitoring/summary:
    get:
      operationId: get-monitoring-summary
      tags:
        - performance monitoring
      summary: Get the monitoring dashboard summary.
      description: >-
        Returns high-level metrics and trends for routes, jobs, commands, and
        queries in a single call, plus the top-10 slowest routes and queries
        (by p95). Performance monitoring data is retained for 30 days.
        Queries for older data will return empty results.
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type:
              - integer
          description: The project identifier.
        - in: query
          name: filter[interval]
          required: false
          schema:
            type:
              - string
            enum:
              - 1h
              - 3h
              - 6h
              - 24h
              - 48h
              - 7d
              - 14d
            default: 24h
          description: 'Time interval for the summary (default 24h). Also accepts custom:START,END with ISO 8601 dates (e.g. custom:2021-01-01T00:00:00Z,2021-01-31T23:59:59Z).'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type:
                  - object
                properties:
                  data:
                    type:
                      - object
                    properties:
                      interval:
                        $ref: '#/components/schemas/monitoringInterval'
                      routes:
                        type:
                          - object
                        properties:
                          metrics:
                            $ref: '#/components/schemas/monitoringMetrics'
                          trend:
                            $ref: '#/components/schemas/monitoringTrend'
                      jobs:
                        type:
                          - object
                        properties:
                          metrics:
                            $ref: '#/components/schemas/monitoringMetrics'
                          trend:
                            $ref: '#/components/schemas/monitoringTrend'
                      commands:
                        type:
                          - object
                        properties:
                          metrics:
                            $ref: '#/components/schemas/monitoringMetrics'
                          trend:
                            $ref: '#/components/schemas/monitoringTrend'
                      queries:
                        type:
                          - object
                        properties:
                          metrics:
                            $ref: '#/components/schemas/monitoringMetrics'
                          trend:
                            $ref: '#/components/schemas/monitoringTrend'
                      slowest_routes:
                        type:
                          - array
                        description: Top 10 slowest routes by p95.
                        items:
                          $ref: '#/components/schemas/monitoringAggregation'
                      slowest_queries:
                        type:
                          - array
                        description: Top 10 slowest queries by p95.
                        items:
                          $ref: '#/components/schemas/monitoringAggregation'
  /projects/{project_id}/monitoring/{type}:
    get:
      operationId: list-monitoring-aggregations
      tags:
        - performance monitoring
      summary: List aggregations by type.
      description: >-
        Returns a paginated, filterable, sortable list of aggregations for the
        given type. Duration filter values (p50, p90, p95, p99, average) are
        accepted in milliseconds. Performance monitoring data is retained for
        30 days. Queries for older data will return empty results.
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type:
              - integer
          description: The project identifier.
        - in: path
          name: type
          required: true
          schema:
            type:
              - string
            enum:
              - routes
              - queries
              - jobs
              - commands
              - external-http
              - views
              - livewire-components
          description: The aggregation type.
        - in: query
          name: filter[interval]
          required: false
          schema:
            type:
              - string
            enum:
              - 1h
              - 3h
              - 6h
              - 24h
              - 48h
              - 7d
              - 14d
            default: 24h
          description: 'Time interval (default 24h). Also accepts custom:START,END with ISO 8601 dates (e.g. custom:2021-01-01T00:00:00Z,2021-01-31T23:59:59Z).'
        - in: query
          name: filter[search]
          required: false
          schema:
            type:
              - string
          description: Free-text search filter.
        - $ref: '#/components/parameters/FilterP50Eq'
        - $ref: '#/components/parameters/FilterP50Neq'
        - $ref: '#/components/parameters/FilterP50Gt'
        - $ref: '#/components/parameters/FilterP50Gte'
        - $ref: '#/components/parameters/FilterP50Lt'
        - $ref: '#/components/parameters/FilterP50Lte'
        - $ref: '#/components/parameters/FilterP90Eq'
        - $ref: '#/components/parameters/FilterP90Neq'
        - $ref: '#/components/parameters/FilterP90Gt'
        - $ref: '#/components/parameters/FilterP90Gte'
        - $ref: '#/components/parameters/FilterP90Lt'
        - $ref: '#/components/parameters/FilterP90Lte'
        - $ref: '#/components/parameters/FilterP95Eq'
        - $ref: '#/components/parameters/FilterP95Neq'
        - $ref: '#/components/parameters/FilterP95Gt'
        - $ref: '#/components/parameters/FilterP95Gte'
        - $ref: '#/components/parameters/FilterP95Lt'
        - $ref: '#/components/parameters/FilterP95Lte'
        - $ref: '#/components/parameters/FilterP99Eq'
        - $ref: '#/components/parameters/FilterP99Neq'
        - $ref: '#/components/parameters/FilterP99Gt'
        - $ref: '#/components/parameters/FilterP99Gte'
        - $ref: '#/components/parameters/FilterP99Lt'
        - $ref: '#/components/parameters/FilterP99Lte'
        - $ref: '#/components/parameters/FilterAverageEq'
        - $ref: '#/components/parameters/FilterAverageNeq'
        - $ref: '#/components/parameters/FilterAverageGt'
        - $ref: '#/components/parameters/FilterAverageGte'
        - $ref: '#/components/parameters/FilterAverageLt'
        - $ref: '#/components/parameters/FilterAverageLte'
        - $ref: '#/components/parameters/FilterCountEq'
        - $ref: '#/components/parameters/FilterCountNeq'
        - $ref: '#/components/parameters/FilterCountGt'
        - $ref: '#/components/parameters/FilterCountGte'
        - $ref: '#/components/parameters/FilterCountLt'
        - $ref: '#/components/parameters/FilterCountLte'
        - $ref: '#/components/parameters/FilterThroughputEq'
        - $ref: '#/components/parameters/FilterThroughputNeq'
        - $ref: '#/components/parameters/FilterThroughputGt'
        - $ref: '#/components/parameters/FilterThroughputGte'
        - $ref: '#/components/parameters/FilterThroughputLt'
        - $ref: '#/components/parameters/FilterThroughputLte'
        - $ref: '#/components/parameters/FilterErrorRateEq'
        - $ref: '#/components/parameters/FilterErrorRateNeq'
        - $ref: '#/components/parameters/FilterErrorRateGt'
        - $ref: '#/components/parameters/FilterErrorRateGte'
        - $ref: '#/components/parameters/FilterErrorRateLt'
        - $ref: '#/components/parameters/FilterErrorRateLte'
        - in: query
          name: sort
          required: false
          schema:
            type:
              - string
            enum:
              - p50
              - p90
              - p95
              - p99
              - average
              - count
              - throughput
              - error_rate
              - importance
              - '-p50'
              - '-p90'
              - '-p95'
              - '-p99'
              - '-average'
              - '-count'
              - '-throughput'
              - '-error_rate'
              - '-importance'
            default: '-p95'
          description: 'Sort field. Prefix with - for descending (default: -p95).'
        - $ref: '#/components/parameters/PageNumber'
        - in: query
          name: page[size]
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 15
          description: Number of items per page (default 15, maximum 30).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type:
                  - object
                properties:
                  data:
                    type:
                      - array
                    items:
                      $ref: '#/components/schemas/monitoringAggregation'
                  meta:
                    type:
                      - object
                    properties:
                      current_page:
                        type:
                          - integer
                        examples:
                          - 1
                      total:
                        type:
                          - integer
                        description: Total number of matching aggregations.
                        examples:
                          - 42
                      per_page:
                        type:
                          - integer
                        examples:
                          - 15
                      last_page:
                        type:
                          - integer
                        examples:
                          - 3
                      interval:
                        $ref: '#/components/schemas/monitoringInterval'
                      totals:
                        description: Aggregate metrics across ALL matching rows (not just current page).
                        $ref: '#/components/schemas/monitoringMetrics'
  /projects/{project_id}/monitoring/{type}/time-series:
    get:
      operationId: get-monitoring-time-series
      tags:
        - performance monitoring
      summary: Get time series data for an aggregation type.
      description: >-
        Returns lightweight time series data for graphing. Precision is
        auto-selected based on the interval: minute for ≤24h, hour for ≤14d,
        day otherwise. Accepts the same filter parameters as the list endpoint.
        Performance monitoring data is retained for 30 days.
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type:
              - integer
          description: The project identifier.
        - in: path
          name: type
          required: true
          schema:
            type:
              - string
            enum:
              - routes
              - queries
              - jobs
              - commands
              - external-http
              - views
              - livewire-components
          description: The aggregation type.
        - in: query
          name: filter[interval]
