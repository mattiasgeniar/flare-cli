    monitoringMetrics:
      type:
        - object
      description: >-
        Aggregated performance metrics. All duration values are in milliseconds.
        Performance monitoring data is retained for 30 days in ClickHouse.
        Queries for older data will return empty results.
      properties:
        p50_ms:
          type:
            - number
          description: 50th percentile duration in milliseconds.
          examples:
            - 45.2
        p90_ms:
          type:
            - number
          description: 90th percentile duration in milliseconds.
          examples:
            - 120.5
        p95_ms:
          type:
            - number
          description: 95th percentile duration in milliseconds.
          examples:
            - 180.3
        p99_ms:
          type:
            - number
          description: 99th percentile duration in milliseconds.
          examples:
            - 350.0
        average_ms:
          type:
            - number
          description: Average duration in milliseconds.
          examples:
            - 65.8
        count:
          type:
            - integer
          description: Total number of occurrences.
          examples:
            - 1500
        error_rate:
          type:
            - number
          description: Error rate as a decimal (0.0 to 1.0).
          examples:
            - 0.02
        importance:
          type:
            - 'null'
            - number
          description: Computed importance score (available in list endpoints).
          examples:
            - 85.3
    monitoringTrend:
      type:
        - object
      description: Per-metric change percentages comparing the selected interval against the equivalent previous period.
      properties:
        p50_change:
          type:
            - number
          description: Percentage change in p50.
          examples:
            - -5.2
        p50_trend:
          type:
            - string
          enum:
            - positive_increase
            - positive_decrease
            - negative_increase
            - negative_decrease
            - none
          description: Direction and sentiment of p50 change.
          examples:
            - positive_decrease
        p90_change:
          type:
            - number
          examples:
            - -3.1
        p90_trend:
          type:
            - string
          enum:
            - positive_increase
            - positive_decrease
            - negative_increase
            - negative_decrease
            - none
          examples:
            - positive_decrease
        p95_change:
          type:
            - number
          examples:
            - 2.5
        p95_trend:
          type:
            - string
          enum:
            - positive_increase
            - positive_decrease
            - negative_increase
            - negative_decrease
            - none
          examples:
            - negative_increase
        p99_change:
          type:
            - number
          examples:
            - 0.0
        p99_trend:
          type:
            - string
          enum:
            - positive_increase
            - positive_decrease
            - negative_increase
            - negative_decrease
            - none
          examples:
            - none
        average_change:
          type:
            - number
          examples:
            - -1.8
        average_trend:
          type:
            - string
          enum:
            - positive_increase
            - positive_decrease
            - negative_increase
            - negative_decrease
            - none
          examples:
            - positive_decrease
        count_change:
          type:
            - number
          examples:
            - 10.0
        count_trend:
          type:
            - string
          enum:
            - positive_increase
            - positive_decrease
            - negative_increase
            - negative_decrease
            - none
          examples:
            - positive_increase
        error_rate_change:
          type:
            - number
          examples:
            - -0.5
        error_rate_trend:
          type:
            - string
          enum:
            - positive_increase
            - positive_decrease
