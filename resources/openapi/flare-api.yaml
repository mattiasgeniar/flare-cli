  /aggregations/{type}/{uuid}:
    get:
      operationId: get-monitoring-aggregation
      tags:
        - performance monitoring
      summary: Get a single aggregation with detail.
      description: >-
        Returns detailed metrics, trends, and relationship link counts for a
        single aggregation. Use the include parameter to also load time series,
        parent, and/or child aggregations. Trend data is null when a custom
        interval range is used. Performance monitoring data is retained for 30 days.
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type:
              - string
            enum:
              - routes
              - queries
              - jobs
              - commands
              - external-http
              - views
              - livewire-components
          description: The aggregation type.
        - in: path
          name: uuid
          required: true
          schema:
            type:
              - string
          description: The aggregation UUID.
        - in: query
          name: filter[interval]
          required: false
          schema:
            type:
              - string
            enum:
              - 1h
              - 3h
              - 6h
              - 24h
              - 48h
              - 7d
              - 14d
            default: 24h
          description: 'Time interval (default 24h). Also accepts custom:START,END with ISO 8601 dates (e.g. custom:2021-01-01T00:00:00Z,2021-01-31T23:59:59Z).'
        - $ref: '#/components/parameters/FilterP50Eq'
        - $ref: '#/components/parameters/FilterP50Neq'
        - $ref: '#/components/parameters/FilterP50Gt'
        - $ref: '#/components/parameters/FilterP50Gte'
        - $ref: '#/components/parameters/FilterP50Lt'
        - $ref: '#/components/parameters/FilterP50Lte'
        - $ref: '#/components/parameters/FilterP90Eq'
        - $ref: '#/components/parameters/FilterP90Neq'
        - $ref: '#/components/parameters/FilterP90Gt'
        - $ref: '#/components/parameters/FilterP90Gte'
        - $ref: '#/components/parameters/FilterP90Lt'
        - $ref: '#/components/parameters/FilterP90Lte'
        - $ref: '#/components/parameters/FilterP95Eq'
        - $ref: '#/components/parameters/FilterP95Neq'
        - $ref: '#/components/parameters/FilterP95Gt'
        - $ref: '#/components/parameters/FilterP95Gte'
        - $ref: '#/components/parameters/FilterP95Lt'
        - $ref: '#/components/parameters/FilterP95Lte'
        - $ref: '#/components/parameters/FilterP99Eq'
        - $ref: '#/components/parameters/FilterP99Neq'
        - $ref: '#/components/parameters/FilterP99Gt'
        - $ref: '#/components/parameters/FilterP99Gte'
        - $ref: '#/components/parameters/FilterP99Lt'
        - $ref: '#/components/parameters/FilterP99Lte'
        - $ref: '#/components/parameters/FilterAverageEq'
        - $ref: '#/components/parameters/FilterAverageNeq'
        - $ref: '#/components/parameters/FilterAverageGt'
        - $ref: '#/components/parameters/FilterAverageGte'
        - $ref: '#/components/parameters/FilterAverageLt'
        - $ref: '#/components/parameters/FilterAverageLte'
        - $ref: '#/components/parameters/FilterCountEq'
        - $ref: '#/components/parameters/FilterCountNeq'
        - $ref: '#/components/parameters/FilterCountGt'
        - $ref: '#/components/parameters/FilterCountGte'
        - $ref: '#/components/parameters/FilterCountLt'
        - $ref: '#/components/parameters/FilterCountLte'
        - $ref: '#/components/parameters/FilterThroughputEq'
        - $ref: '#/components/parameters/FilterThroughputNeq'
        - $ref: '#/components/parameters/FilterThroughputGt'
        - $ref: '#/components/parameters/FilterThroughputGte'
        - $ref: '#/components/parameters/FilterThroughputLt'
        - $ref: '#/components/parameters/FilterThroughputLte'
        - $ref: '#/components/parameters/FilterErrorRateEq'
        - $ref: '#/components/parameters/FilterErrorRateNeq'
        - $ref: '#/components/parameters/FilterErrorRateGt'
        - $ref: '#/components/parameters/FilterErrorRateGte'
        - $ref: '#/components/parameters/FilterErrorRateLt'
        - $ref: '#/components/parameters/FilterErrorRateLte'
        - in: query
          name: include
          required: false
          schema:
            type:
              - string
          description: >-
            Comma-separated list of optional includes: time_series, parents,
            children. Example: include=time_series,parents,children
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type:
                  - object
                properties:
                  data:
                    type:
                      - object
                    properties:
                      aggregation:
                        $ref: '#/components/schemas/monitoringAggregation'
                      trend:
                        description: Null when a custom interval range is used.
                        oneOf:
                          - $ref: '#/components/schemas/monitoringTrend'
                          - type: 'null'
                      interval:
                        $ref: '#/components/schemas/monitoringInterval'
                      parent_links:
                        type:
                          - array
                        description: Counts of parent aggregations grouped by type.
                        items:
                          $ref: '#/components/schemas/monitoringLinkCount'
                      child_links:
                        type:
                          - array
                        description: Counts of child aggregations grouped by type.
                        items:
                          $ref: '#/components/schemas/monitoringLinkCount'
                      time_series:
                        description: Only present when include=time_series is requested.
                        type:
                          - object
                        properties:
                          precision:
                            type:
                              - string
                            enum:
                              - minute
                              - hour
                              - day
                          points:
                            type:
                              - array
                            items:
                              $ref: '#/components/schemas/monitoringTimeSeriesPoint'
                      parents:
                        description: >-
                          Only present when include=parents is requested.
                          Object keyed by aggregation type, each containing an array of aggregations.
                        type:
                          - object
                        additionalProperties:
                          type:
                            - array
                          items:
                            $ref: '#/components/schemas/monitoringAggregation'
                      children:
                        description: >-
                          Only present when include=children is requested.
                          Object keyed by aggregation type, each containing an array of aggregations.
                        type:
                          - object
                        additionalProperties:
                          type:
                            - array
                          items:
                            $ref: '#/components/schemas/monitoringAggregation'
  /aggregations/{type}/{uuid}/traces:
    get:
      operationId: list-aggregation-traces
      tags:
        - performance monitoring
      summary: List traces for an aggregation.
      description: >-
        Returns a paginated list of lightweight traces for the given aggregation.
        Uses a fixed 6-hour lookback window (not configurable). For full span
        details, use the show trace endpoint. Performance monitoring data is
        retained for 30 days.
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type:
              - string
            enum:
              - routes
              - queries
              - jobs
              - commands
              - external-http
              - views
              - livewire-components
          description: The aggregation type.
        - in: path
          name: uuid
          required: true
          schema:
            type:
              - string
          description: The aggregation UUID.
        - in: query
          name: sort
          required: false
          schema:
            type:
              - string
            enum:
              - slowest
              - fastest
              - latest
              - oldest
            default: slowest
          description: Sort order (default slowest).
        - in: query
          name: page[number]
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number.
        - in: query
          name: page[size]
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 10
          description: Number of items per page (default 10, maximum 30).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type:
                  - object
                properties:
                  data:
                    type:
                      - array
                    items:
                      type:
                        - object
                      properties:
                        trace_id:
                          type:
                            - string
                          description: The trace identifier.
                          examples:
                            - abc123def456
                        started_at:
                          type:
                            - string
                          format: date-time
                          description: When the trace started (ISO 8601).
                          examples:
                            - '2026-02-18T10:00:00+00:00'
                        duration_ms:
                          type:
                            - number
                          description: Trace duration in milliseconds.
                          examples:
                            - 245.8
                  meta:
                    type:
                      - object
                    properties:
                      current_page:
                        type:
                          - integer
                        examples:
                          - 1
                      total:
                        type:
                          - integer
                        examples:
                          - 25
                      per_page:
                        type:
                          - integer
                        examples:
                          - 10
                      last_page:
                        type:
                          - integer
                        examples:
                          - 3
                      interval:
                        type:
                          - object
                        description: The fixed 6-hour lookback window.
                        properties:
                          start:
                            type:
                              - string
                            format: date-time
                          end:
                            type:
                              - string
                            format: date-time
                          fixed_window:
                            type:
                              - string
                            description: Always "6h".
                            examples:
                              - 6h
  /traces/{traceId}:
    get:
      operationId: get-trace
      tags:
        - performance monitoring
      summary: Get the full span tree for a trace.
      description: >-
        Returns the complete span tree for a trace, including all span events,
        resources, and contexts. Spans are returned as a flat array — use
        parent_span_id to build the tree on the consumer side. All durations
        are in milliseconds. Performance monitoring data is retained for 30 days.
      parameters:
        - in: path
          name: traceId
          required: true
          schema:
            type:
              - string
          description: The trace identifier.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type:
                  - object
                properties:
                  data:
                    $ref: '#/components/schemas/monitoringTrace'
